name: ai-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    uses: muxinc/code-review-analysis/.github/workflows/ai-review-observe.yml@main
    secrets: inherit
